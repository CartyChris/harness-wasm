[package]
name = "harness-core"
version = "0.1.0"
edition = "2021"
publish = false

# Pure, no-wasm logic shared by the client: model policy, SSE parsing,
# session/message types. Host-testable with plain `cargo test`.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
