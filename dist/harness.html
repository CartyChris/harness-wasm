<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Harness</title>
<style>
/* Harness — single-file client styles.
   iPhone Safari gates (DESIGN.md §7) are marked [GATE] and are not optional:
   16px inputs, 100dvh + 100vh fallback, safe-area on all edges, visualViewport
   composer tracking (--vvh/--vvtop from Rust), ≥44px targets, no hover-only
   controls, no CDN anything. */

:root {
  --bg: #0b0d10;
  --bg-raised: #14171c;
  --bg-raised-2: #1b1f26;
  --line: #262b33;
  --text: #e8eaee;
  --text-dim: #9aa3af;
  --text-faint: #6b7480;
  --accent: #6aa2ff;
  --accent-strong: #3d7bf5;
  --accent-soft: rgba(106, 162, 255, 0.14);
  --user-bubble: #24406e;
  --danger: #ff6b6b;
  --warn: #ffb454;
  --ok: #4ade80;
  --radius: 18px;
  --radius-sm: 12px;
  /* Updated from visualViewport by the app; keep layout honest pre-boot. */
  --vvh: 100dvh;
  --vvtop: 0px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  /* [GATE] 100vh fallback with 100dvh; the app layer overrides from
     visualViewport via --vvh. Body is fixed so iOS rubber-banding never
     scrolls the chrome away from under the keyboard. */
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, sans-serif; /* [GATE] system font stack, no font CDN */
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

/* [GATE] All inputs/selects/textareas ≥16px — no iOS focus zoom. */
input, select, textarea, button {
  font: inherit;
  font-size: 16px;
}

/* ------------------------------------------------------------------ shell */

#shell {
  height: 100vh;
  height: 100dvh;
  height: var(--vvh, 100dvh);
  display: flex;
  flex-direction: column;
}

.boot-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(var(--sat) + 10px) calc(var(--sar) + 16px) 10px calc(var(--sal) + 16px);
  border-bottom: 1px solid var(--line);
  background: rgba(20, 23, 28, 0.85);
}

.boot-mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent-strong), #8f6aff);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: #fff;
}

.boot-title {
  font-weight: 650;
  letter-spacing: 0.2px;
}

.boot-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
}

.boot-glyph {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-strong), #8f6aff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  color: #fff;
  box-shadow: 0 12px 40px rgba(61, 123, 245, 0.35);
}

.boot-loading {
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 10px;
}

.boot-dots span {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 4px;
  border-radius: 50%;
  background: var(--accent);
  animation: boot-pulse 1.1s infinite ease-in-out;
}
.boot-dots span:nth-child(2) { animation-delay: 0.18s; }
.boot-dots span:nth-child(3) { animation-delay: 0.36s; }

@keyframes boot-pulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-3px); }
}

#init-error {
  display: none;
  margin: 12vh 24px 0;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: rgba(255, 107, 107, 0.12);
  border: 1px solid rgba(255, 107, 107, 0.35);
  color: #ffb3b3;
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
}
#init-error.is-visible { display: block; }

.boot-error-title { font-weight: 700; color: #ffd0d0; margin-bottom: 4px; }

noscript p {
  margin: 0 24px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: rgba(255, 180, 84, 0.12);
  border: 1px solid rgba(255, 180, 84, 0.35);
  color: #ffd9a3;
  text-align: center;
}

/* ------------------------------------------------------------------- app */

.app {
  position: fixed;
  left: 0;
  right: 0;
  top: var(--vvtop, 0px);
  height: 100vh;      /* [GATE] fallback */
  height: 100dvh;     /* [GATE] modern */
  height: var(--vvh, 100dvh); /* [GATE] visualViewport-tracked */
  display: flex;
  flex-direction: column;
  padding-left: var(--sal);
  padding-right: var(--sar);
  background: var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  /* [GATE] safe-area on the top edge */
  padding: calc(var(--sat) + 8px) 12px 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-raised);
  flex: none;
}

.topbar-title {
  flex: 1;
  min-width: 0;
  font-weight: 650;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}

/* [GATE] tap targets ≥44px */
.icon-btn, .send-btn, .mini-btn, .primary-btn, .secondary-btn,
.session-open, .banner-connect {
  min-height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.icon-btn { flex: none; padding: 0 10px; background: var(--bg-raised-2); }
.icon-btn:active { background: #232833; }

.icon-menu, .icon-close, .icon-rename {
  display: inline-block;
  width: 18px;
  height: 18px;
}
.icon-menu {
  background: linear-gradient(currentColor 0 0);
  /* hamburger via stacked bars */
  -webkit-mask: none;
  position: relative;
}
.icon-menu::before, .icon-menu::after {
  content: "";
  position: absolute;
  left: 0;
  width: 18px;
  height: 2px;
  background: currentColor;
  border-radius: 1px;
  top: 3px;
}
.icon-menu::after { top: 13px; }
.icon-menu { background: transparent; }

.icon-close {
  position: relative;
  background: transparent;
}
.icon-close::before, .icon-close::after {
  content: "";
  position: absolute;
  left: 1px;
  top: 8px;
  width: 16px;
  height: 2px;
  background: currentColor;
  border-radius: 1px;
}
.icon-close::before { transform: rotate(45deg); }
.icon-close::after { transform: rotate(-45deg); }

.icon-rename {
  position: relative;
  background: transparent;
}
.icon-rename::before {
  content: "✎";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.model-chip {
  flex: none;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-raised-2);
  color: var(--text-dim);
  font-size: 13px;
  max-width: 46%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: pointer;
}
.model-chip:active { border-color: var(--accent); color: var(--text); }

.chip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  flex: none;
}
.app:not(.is-streaming) .chip-dot { background: var(--ok); }

/* banners */
.banner {
  flex: none;
  margin: 8px 12px 0;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  text-align: left;
  cursor: default;
}
.banner-connect {
  width: calc(100% - 24px);
  background: var(--accent-soft);
  border: 1px solid rgba(106, 162, 255, 0.4);
  color: #bcd4ff;
  cursor: pointer;
  text-align: center;
}
.banner-connect:active { background: rgba(106, 162, 255, 0.24); }
.banner-warn {
  background: rgba(255, 180, 84, 0.12);
  border: 1px solid rgba(255, 180, 84, 0.4);
  color: #ffd9a3;
}
.banner-note {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.banner-note ul { margin: 0 0 8px 0; padding-left: 18px; }
.banner-note .mini-btn { border: 1px solid var(--line); padding: 0 14px; min-height: 44px; }

/* thread */
.thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 16px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-faint);
  padding: 32px 24px;
}
.empty-mark { font-size: 34px; color: var(--accent); margin-bottom: 6px; }
.empty-title { font-size: 19px; font-weight: 700; color: var(--text-dim); margin: 0 0 6px; }
.empty-hint { font-size: 14px; margin: 0; max-width: 300px; }

.msg { display: flex; flex-direction: column; max-width: 100%; }
.msg-user { align-items: flex-end; }
.msg-assistant { align-items: flex-start; }

.bubble {
  max-width: 92%;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--bg-raised);
  border: 1px solid var(--line);
}
.msg-user .bubble {
  background: var(--user-bubble);
  border-color: rgba(106, 162, 255, 0.35);
}

.msg-body { display: flex; flex-direction: column; gap: 8px; }
.msg-text {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 16px;
}
.msg-placeholder { color: var(--text-faint); }

.msg-status {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--text-faint);
  display: flex;
  align-items: center;
  gap: 7px;
}
.msg-status-err { color: var(--danger); }
.msg-status-warn { color: var(--warn); }

.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: msg-pulse 1s infinite ease-in-out;
}
@keyframes msg-pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.1); }
}

.retry-btn {
  margin-top: 8px;
  border: 1px solid var(--line);
  background: var(--bg-raised-2);
  padding: 0 16px;
  font-size: 14px;
  align-self: flex-start;
}
.retry-btn:active { border-color: var(--accent); }

/* code cards */
.codecard {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #0e1014;
}
.codecard-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 8px 0 12px;
  background: var(--bg-raised-2);
  border-bottom: 1px solid var(--line);
}
.codecard-lang {
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: 0.4px;
  text-transform: lowercase;
}
.codecard-pre {
  margin: 0;
  padding: 12px;
  max-height: 220px;
  overflow: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  color: #cfe3ff;
  white-space: pre;
}

/* composer */
.composer-zone {
  flex: none;
  padding: 8px 12px 6px;
  border-top: 1px solid var(--line);
  background: var(--bg-raised);
  /* [GATE] safe-area on the bottom edge (keyboard closes: full inset) */
  padding-bottom: calc(6px + var(--sab));
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.composer-input {
  flex: 1;
  min-height: 44px;
  max-height: 132px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  /* [GATE] 16px — no iOS zoom on focus */
  font-size: 16px;
  resize: none;
  line-height: 1.4;
}
.composer-input:focus {
  outline: none;
  border-color: var(--accent-strong);
  box-shadow: 0 0 0 3px rgba(61, 123, 245, 0.22);
}

.send-btn {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent-strong);
  color: #fff;
}
.send-btn:disabled { background: #2a3038; color: var(--text-faint); }
.send-btn:not(:disabled):active { background: #2f66d8; }

.send-glyph {
  width: 16px;
  height: 16px;
  border-left: 2px solid currentColor;
  border-top: 2px solid currentColor;
  transform: rotate(45deg) translate(1px, 1px);
}
.send-glyph.is-stop {
  width: 12px;
  height: 12px;
  border: none;
  border-radius: 3px;
  background: currentColor;
  transform: none;
}

.composer-foot {
  margin-top: 5px;
  text-align: center;
  font-size: 11.5px;
  color: var(--text-faint);
}

/* overlays — unmount when closed; nothing here relies on display:none */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
}
.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 9, 0.62);
  backdrop-filter: blur(2px);
  border: none;
  padding: 0;
}

.drawer {
  position: absolute;
  top: 0;
  bottom: 0;
  /* [GATE] safe-area on the left edge */
  left: calc(var(--sal));
  width: min(84vw, 340px);
  background: var(--bg-raised);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: calc(var(--sat) + 10px) 12px calc(var(--sab) + 12px) 12px;
  animation: drawer-in 0.22s ease-out;
}
@keyframes drawer-in {
  from { transform: translateX(-24px); opacity: 0.4; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-head, .sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.drawer-head h2, .sheet-head h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
}
.sheet-head-actions { display: flex; align-items: center; gap: 8px; }

.primary-btn, .secondary-btn {
  padding: 0 18px;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius-sm);
}
.primary-btn { background: var(--accent-strong); color: #fff; }
.primary-btn:active { background: #2f66d8; }
.secondary-btn {
  background: var(--bg-raised-2);
  border: 1px solid var(--line);
  color: var(--text);
}
.secondary-btn:active { border-color: var(--accent); }

.drawer-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.session-row {
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: var(--radius-sm);
  padding: 2px;
  border: 1px solid transparent;
}
.session-row.is-current { background: var(--accent-soft); border-color: rgba(106, 162, 255, 0.35); }

.session-open {
  flex: 1;
  min-width: 0;
  justify-content: flex-start;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 6px 10px;
}
.session-title {
  font-size: 15px;
  color: var(--text);
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.session-meta { font-size: 12px; color: var(--text-faint); }

.session-rename {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
}

.session-actions { display: flex; gap: 4px; flex: none; }
.session-actions .mini-btn { padding: 0 10px; font-size: 13px; color: var(--text-dim); }
.session-actions .mini-btn.danger { color: var(--danger); }
.session-actions .mini-btn.is-confirming {
  color: #fff;
  background: var(--danger);
  border-color: var(--danger);
}

.mini-btn {
  padding: 0 12px;
  font-size: 14px;
  background: var(--bg-raised-2);
  border: 1px solid var(--line);
  color: var(--text);
}
.mini-btn:active { border-color: var(--accent); }

/* bottom sheets */
.overlay:not(:has(.drawer)) {
  align-items: flex-end;
  justify-content: center;
}

.sheet {
  position: relative;
  width: min(100%, 560px);
  max-height: 86%;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  display: flex;
  flex-direction: column;
  padding: calc(var(--sat) + 12px) 16px calc(var(--sab) + 12px) 16px;
  animation: sheet-in 0.24s ease-out;
}
@keyframes sheet-in {
  from { transform: translateY(28px); opacity: 0.5; }
  to { transform: translateY(0); opacity: 1; }
}

.sheet-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 6px 0 12px;
}

.field { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field-label { font-size: 13.5px; font-weight: 600; color: var(--text-dim); }
.field-input {
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  width: 100%;
}
.field-input:focus {
  outline: none;
  border-color: var(--accent-strong);
  box-shadow: 0 0 0 3px rgba(61, 123, 245, 0.22);
}
.field-hint { font-size: 12.5px; color: var(--text-faint); }

.health-note { font-size: 13.5px; color: var(--text-dim); }

datalist { display: none; }

/* artifacts */
.artifact-sheet { max-height: 92%; }
.artifact-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0e1014;
}
.artifact-pre {
  flex: 1;
  margin: 0;
  padding: 12px;
  overflow: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  color: #cfe3ff;
  white-space: pre;
}
.artifact-frame {
  flex: 1;
  width: 100%;
  border: none;
  background: #fff;
}
.sheet-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 10px;
}

/* [GATE] hover styles are additive only — every control works without hover */
@media (hover: hover) {
  .icon-btn:hover { background: #232833; }
  .model-chip:hover { border-color: var(--accent); }
  .primary-btn:hover { background: #2f66d8; }
  .secondary-btn:hover, .mini-btn:hover { border-color: var(--accent); }
  .session-row:hover { background: var(--bg-raised-2); }
  .session-row.is-current:hover { background: var(--accent-soft); }
}

@media (min-width: 720px) {
  .bubble { max-width: 76%; }
  .sheet { border-radius: var(--radius); border-bottom: 1px solid var(--line); margin-bottom: 5vh; }
}

/* Reduce motion where requested */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; }
}

</style>
</head>
<body>
<div id="shell">
  <div class="boot-topbar">
    <span class="boot-mark" aria-hidden="true">H</span>
    <span class="boot-title">Harness</span>
  </div>
  <div class="boot-body">
    <div class="boot-glyph" aria-hidden="true">H</div>
    <div class="boot-loading">Loading <span class="boot-dots"><span></span><span></span><span></span></span></div>
  </div>
  <noscript><p>Harness needs JavaScript enabled — the whole app is WebAssembly.</p></noscript>
</div>
<div id="init-error" role="alert"></div>
<div id="app"></div>
<script>
let wasm_bindgen = (function(exports) {
    let script_src;
    if (typeof document !== 'undefined' && document.currentScript !== null) {
        script_src = new URL(document.currentScript.src, location.href).toString();
    }

    class IntoUnderlyingByteSource {
        __destroy_into_raw() {
            const ptr = this.__wbg_ptr;
            this.__wbg_ptr = 0;
            IntoUnderlyingByteSourceFinalization.unregister(this);
